<!doctype html>
<html lang="en" data-mode="dark" class="nav-float">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dry</title>
  <meta name="description" content="dry, running in this browser: engines, their turns and asks, kept in IndexedDB, calling your own model server.">
  <!-- The wasm app (trunk builds it; docs/browser.md). -->
  <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-typescript="false" />
  <!-- Amarante, served at fonts/ beside this page. -->
  <link data-trunk rel="copy-dir" href="../../assets/fonts" />
  <!-- The container route's VM glue (docs/container.md); v86 itself loads only when a VM boots. -->
  <link data-trunk rel="copy-dir" href="vm" />
  <script type="module" src="vm/vm.js"></script>
  <!-- The look: written by the app from the theme tokens and the layout standard. -->
  <style id="app-css"></style>
  <style id="tokens"></style>
  <style>
    /* Before the app draws: the theme's dark body, so there is no white flash. */
    html,body{margin:0;background:#000;color:#ddd;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
    #boot{position:fixed;inset:0;display:grid;place-items:center;color:#888}
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="backdrop" aria-hidden="true"></div>
  <nav id="nav" class="glass"></nav>
  <div id="pane" class="glass"><div id="boot">Starting dry…</div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">dry runs as WebAssembly in this page: turn JavaScript on to use it.</p></noscript>
</body>
</html>
