<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .card {
    background: #2a2a33;
    border-radius: 20px;
    padding: 32px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    min-width: 260px;
  }
  .count {
    font-size: 64px;
    font-weight: 700;
    color: #f5f5f7;
    margin: 0 0 24px 0;
    font-variant-numeric: tabular-nums;
  }
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  button {
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 22px;
    font-weight: 700;
    color: #f5f5f7;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.1s ease;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.95); }
  #increment { background: #3d7ef7; }
  #decrement { background: #e05252; }
  #reset { background: #4a4a57; font-size: 16px; padding: 14px 18px; }
</style>
</head>
<body>
  <div class="card">
    <p class="count" id="count">0</p>
    <div class="controls">
      <button id="decrement" aria-label="Decrement">−</button>
      <button id="reset">Reset</button>
      <button id="increment" aria-label="Increment">+</button>
    </div>
  </div>
  <script>
    const countEl = document.getElementById('count');
    let count = 0;
    function render() { countEl.textContent = count; }
    document.getElementById('increment').addEventListener('click', () => { count += 1; render(); });
    document.getElementById('decrement').addEventListener('click', () => { count -= 1; render(); });
    document.getElementById('reset').addEventListener('click', () => { count = 0; render(); });
  </script>
</body>
</html>
